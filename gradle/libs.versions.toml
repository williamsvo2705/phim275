[versions]
agp = "9.5.1"
# AGP 9 dùng Kotlin tích hợp; khai báo KGP để nâng trình biên dịch (GeckoView cần stdlib 2.4).
kotlin = "2.4.21"
geckoview = "159.0.20261102144711"
junit = "4.13.2"
orgjson = "20260814"
media3 = "1.11.1"

[libraries]
geckoview = { module = "org.mozilla.geckoview:geckoview", version.ref = "geckoview" }
junit = { module = "junit:junit", version.ref = "junit" }
# org.json thật cho unit test JVM (bản trong android.jar chỉ là stub).
orgjson = { module = "org.json:json", version.ref = "orgjson" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
