# Phát hành APK: đẩy tag dạng v0.1.0 → build, ký, tạo GitHub Release.
# Trang tải phim275.vercel.app chuyển hướng /tv, /arm64, /latest.json tới asset của Release mới nhất.
#
# Secrets cần tạo trong Settings → Secrets and variables → Actions:
#   PHIM275_KEYSTORE_BASE64   nội dung file .jks mã hóa base64
#   PHIM275_STORE_PASSWORD    mật khẩu keystore
#   PHIM275_KEY_PASSWORD      mật khẩu khóa (thường trùng mật khẩu keystore)
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest có sẵn Android SDK tại $ANDROID_HOME.
      # (Không dùng android-actions/setup-android@v3: action đó cài gói "tools" đã bị gỡ → lỗi.)
      - name: Cài Android SDK platform 37.2
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Dùng $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Giải mã keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHIM275_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret PHIM275_KEYSTORE_BASE64 — không phát hành bản ký bằng khóa debug."
            exit 1
          fi
          # Bỏ ký tự xuống dòng/khoảng trắng lẫn vào khi tạo secret (vd. từ PowerShell).
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/phim275-release.jks"
          echo "PHIM275_STORE_FILE=$RUNNER_TEMP/phim275-release.jks" >> "$GITHUB_ENV"

      - name: Test và build release
        env:
          PHIM275_STORE_PASSWORD: ${{ secrets.PHIM275_STORE_PASSWORD }}
          PHIM275_KEY_PASSWORD: ${{ secrets.PHIM275_KEY_PASSWORD }}
          PHIM275_KEY_ALIAS: phim275
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Gom APK, checksum, latest.json
        run: |
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/phim275-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          AAPT2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          VERSION_CODE=$("$AAPT2" dump badging dist/phim275-armeabi-v7a.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          VERSION_NAME=$("$AAPT2" dump badging dist/phim275-armeabi-v7a.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          python3 - "$VERSION_CODE" "$VERSION_NAME" <<'EOF'
          import json, sys, pathlib
          code, name = sys.argv[1], sys.argv[2]
          sums = dict(reversed(l.split()) for l in pathlib.Path("dist/SHA256SUMS.txt").read_text().splitlines())
          base = "https://github.com/williamsvo2705/phim275/releases/latest/download/"
          data = {
              "versionCode": int(code),
              "versionName": name,
              "apks": {
                  abi: {"url": base + f"phim275-{abi}.apk", "sha256": sums[f"phim275-{abi}.apk"]}
                  for abi in ("armeabi-v7a", "arm64-v8a")
              },
          }
          pathlib.Path("dist/latest.json").write_text(json.dumps(data, indent=2, ensure_ascii=False))
          print(json.dumps(data, indent=2))
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
